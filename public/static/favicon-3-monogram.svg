<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 背景（角丸スクエア・グラデーション） -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#396999"/>
      <stop offset="100%" stop-color="#2E5580"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bgGrad)"/>

  <!-- 上部アクセント（薄ブルーライン） -->
  <rect x="8" y="8" width="48" height="3" rx="1.5" fill="#AECBE5" opacity="0.6"/>

  <!-- モノグラム「RC」 -->
  <text x="32" y="44"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="30"
        font-weight="800"
        fill="#FFFFFF"
        text-anchor="middle"
        letter-spacing="-1">RC</text>

  <!-- 下部アクセント（承認を示す小さなチェック） -->
  <path d="M 26 52 L 30 56 L 38 48"
        stroke="#AECBE5" stroke-width="2.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.85"/>
</svg>
