<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 背景（角丸スクエア） -->
  <rect width="64" height="64" rx="12" fill="#396999"/>

  <!-- 書類（請求書） -->
  <g>
    <!-- 書類本体 -->
    <path d="M18 12 L40 12 L46 18 L46 52 L18 52 Z" fill="#FFFFFF"/>
    <!-- 折り返し（右上の角） -->
    <path d="M40 12 L40 18 L46 18 Z" fill="#AECBE5"/>

    <!-- 書類の行 -->
    <rect x="22" y="24" width="20" height="2" rx="1" fill="#396999"/>
    <rect x="22" y="30" width="16" height="2" rx="1" fill="#AECBE5"/>
    <rect x="22" y="36" width="18" height="2" rx="1" fill="#AECBE5"/>
    <rect x="22" y="42" width="12" height="2" rx="1" fill="#AECBE5"/>
  </g>

  <!-- 循環矢印（回覧を表現）※右下に配置 -->
  <g transform="translate(46, 46)">
    <circle r="12" fill="#22C55E" stroke="#FFFFFF" stroke-width="2"/>
    <!-- 循環矢印 -->
    <path d="M -5 -1
             A 5 5 0 1 1 -1 5
             L -3 3
             M -1 5
             L 1 3"
          stroke="#FFFFFF" stroke-width="2.2" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 矢印の先端 -->
    <path d="M -5 -1 L -7 1 M -5 -1 L -3 1"
          stroke="#FFFFFF" stroke-width="2.2" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
